 name: Build Windows program

on:
  workflow_dispatch:        # lets you press "Run workflow" on GitHub
  push:
    tags: ["v*"]            # pushing a tag like v1.2 builds AND publishes a release

permissions:
  contents: write           # needed to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Sare.exe
        shell: cmd
        run: build_windows.bat

      - name: Zip the program
        shell: pwsh
        run: Compress-Archive -Path dist\Sare -DestinationPath Sare-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sare-windows
          path: Sare-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sare-windows.zip